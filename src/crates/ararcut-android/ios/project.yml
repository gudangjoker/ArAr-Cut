name: ArArCut
options:
  bundleIdPrefix: com.ararcut
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1000099"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    DEAD_CODE_STRIPPING: YES

targets:
  ArArCut:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ArArCut/Sources
      - path: ArArCut/Resources
      - path: Generated
        excludes:
          - "*.h"
          - "*.modulemap"
    info:
      path: ArArCut/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ararcut.app
        PRODUCT_NAME: ArArCut
        DISPLAY_NAME: "ArAr Cut"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../../../vendor/ffmpeg/aarch64-apple-ios/lib"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lavdevice"
          - "-lavfilter"
          - "-lavformat"
          - "-lavcodec"
          - "-lswresample"
          - "-lswscale"
          - "-lavutil"
          - "-lz"
          - "-lbz2"
          - "-liconv"
          - "-lc++"
          - "-framework"
          - "VideoToolbox"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "CoreMedia"
          - "-framework"
          - "CoreVideo"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "Metal"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "Accelerate"
          - "-framework"
          - "Security"
          - "-framework"
          - "SystemConfiguration"
    dependencies:
      - framework: Frameworks/ArArCutCoreFFI.xcframework
        embed: false
      - framework: Frameworks/SherpaOnnxC.xcframework
        embed: true
